name: CI - Docker (Betrieb)

# Baut die Produktions-Images (backend, frontend) und startet den Stack aus
# docker-compose.prod.yml; ops/smoke-test.sh prüft ihn von außen.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Skripte für den Betrieb: shellcheck (auf den Runnern vorhanden) und
      # der Test von ops/deploy.sh mit Attrappen für docker und curl
      - name: Betriebsskripte prüfen
        run: |
          shellcheck ops/*.sh ops/tests/*.sh ops/demo/*.sh ops/buero/*.sh
          bash ops/tests/deploy.test.sh
      # Windows-Skripte: so gelesen wie von Windows PowerShell 5.1 (BOM, Parser)
      - name: Windows-Skripte prüfen
        run: pwsh -NoProfile -File ops/tests/powershell-check.ps1
      - name: Compose-Datei prüfen
        run: |
          POSTGRES_PASSWORD=x JWT_SECRET=x docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.demo.yml --profile https config --quiet
          POSTGRES_PASSWORD=x JWT_SECRET=x SECRET_KEY=x docker compose -f docker-compose.buero.yml --profile demo --profile cloud --profile tunnel config --quiet
      - name: Rauchtest
        run: bash ops/smoke-test.sh
      # Sicherung zurückspielen – mit gelöschten Volumes, Dokument Byte für Byte
      - name: Sicherung und Zurückspielen
        run: bash ops/tests/backup-restore.sh
      # Demo für Vorführungen (Laptop + Handys im WLAN) mit HTTPS
      - name: Rauchtest Demo
        run: bash ops/tests/demo-smoke.sh
      # Cloud-Sicherung: verschlüsselt spiegeln und zurückholen (rclone, lokaler Ordner als Cloud)
      - name: Cloud-Sicherung
        run: bash ops/tests/cloud-sync.test.sh
      # Browser für die Checkliste BUERO-TEST.md; certutil installiert darin das
      # Stammzertifikat der Büro-CA wie auf dem Büro-Rechner
      - name: Browser für den Büro-Test
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libnss3-tools
      # GartenAI im Büro (ein Rechner, echte Daten): Ersteinrichtung und Checkliste im
      # Browser, Sicherung, Zurückspielen, Beenden/Starten, Neustart von Docker, Update
      - name: Rauchtest Büro
        run: bash ops/tests/buero-smoke.sh
      - name: Browser-Bericht Büro
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: buero-playwright
          path: frontend/test-results/
          if-no-files-found: ignore

  # Dieselbe Büro-Installation mit Podman statt Docker (kostenlos, auch für
  # größere Firmen; Podman Desktop unter Windows/macOS arbeitet genauso): die
  # docker-CLI und docker compose sprechen mit Podmans Docker-kompatibler
  # Schnittstelle, die Startskripte bleiben unverändert.
  podman:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Podman statt Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
          sudo systemctl stop docker.socket docker.service
          # Docker hinterlässt seine Firewall-Regeln (FORWARD-Policy DROP): sie
          # blockieren Podmans Portweiterleitung – die Verbindung zu :8443 kommt
          # zustande, aber keine Daten. Auf einem Rechner ohne Docker gibt es das nicht.
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -F DOCKER-USER 2>/dev/null || true
          sudo iptables -F FORWARD
          sudo systemctl start podman.socket
          # Socket-Ordner gehört root: für den CI-Nutzer öffnen (nur auf dem Runner)
          sudo chmod 711 /run/podman
          sudo chmod 666 /run/podman/podman.sock
          echo "DOCKER_HOST=unix:///run/podman/podman.sock" >> "$GITHUB_ENV"
      - name: Podman antwortet als docker
        run: |
          podman --version
          docker version --format '{{.Server.Version}} {{range .Server.Components}}{{.Name}} {{end}}'
          docker compose version
      - name: Rauchtest Büro mit Podman
        run: bash ops/tests/buero-smoke.sh
        timeout-minutes: 25
      - name: Diagnose bei Fehler
        if: failure()
        run: |
          set +e
          docker ps -a
          sudo ss -ltnp | grep -E ':8443|:3000' || true
          for url in https://localhost:8443/ https://127.0.0.1:8443/ 'https://[::1]:8443/'; do
            echo "== $url"; curl -skv --connect-timeout 5 --max-time 10 -o /dev/null "$url" 2>&1 | tail -5
          done
          sudo nft list ruleset 2>/dev/null | grep -n 8443 || true
          sysctl net.ipv4.conf.all.route_localnet


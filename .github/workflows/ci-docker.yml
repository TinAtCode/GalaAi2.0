name: CI - Docker (Betrieb)

# Baut die Produktions-Images (backend, frontend) und startet den Stack aus
# docker-compose.prod.yml; ops/smoke-test.sh prüft ihn von außen.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Skripte für den Betrieb: shellcheck (auf den Runnern vorhanden) und
      # der Test von ops/deploy.sh mit Attrappen für docker und curl
      - name: Betriebsskripte prüfen
        run: |
          shellcheck ops/*.sh ops/tests/*.sh ops/demo/*.sh ops/buero/*.sh
          bash ops/tests/deploy.test.sh
      - name: Compose-Datei prüfen
        run: |
          POSTGRES_PASSWORD=x JWT_SECRET=x docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.demo.yml --profile https config --quiet
          POSTGRES_PASSWORD=x JWT_SECRET=x SECRET_KEY=x docker compose -f docker-compose.buero.yml --profile demo config --quiet
      - name: Rauchtest
        run: bash ops/smoke-test.sh
      # Sicherung zurückspielen – mit gelöschten Volumes, Dokument Byte für Byte
      - name: Sicherung und Zurückspielen
        run: bash ops/tests/backup-restore.sh
      # Demo für Vorführungen (Laptop + Handys im WLAN) mit HTTPS
      - name: Rauchtest Demo
        run: bash ops/tests/demo-smoke.sh
      # GartenAI im Büro (ein Rechner, echte Daten): Ersteinrichtung, Sicherung, Zurückspielen
      - name: Rauchtest Büro
        run: bash ops/tests/buero-smoke.sh

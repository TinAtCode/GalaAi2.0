name: CI - Lint & Unit Tests

# Deckt nur ab, was tatsächlich im Repo existiert (Backend/Frontend Unit-
# Tests, Lint, Backend-Integrationstests gegen PostgreSQL). Playwright-E2E-Tests laufen bewusst in einem eigenen
# Workflow (ci-e2e.yml), da sie einen echten Browser + laufende Server
# brauchen. Kein Docker-Build/Deploy hier – siehe STATUS.md für den
# tatsächlichen Umsetzungsstand gegenüber dem größeren CICD_GUIDE.md-Plan.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Blockierend für Lücken ab "high" in den Produktionsabhängigkeiten
      # (Stand: 0 Funde). Entwicklungswerkzeuge nur zur Information.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true

  # Integrationstests gegen eine echte PostgreSQL: dieselben Migrationen wie
  # in Produktion, echter Prisma-Client, echte HTTP-Aufrufe. Fängt Fehler, die
  # die Unit-Tests mit gemocktem Prisma-Client nicht sehen können.
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gartenai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Bewusst kleiner Verbindungspool: Abfragen, die innerhalb einer
      # Transaktion eine zweite Verbindung holen, blockieren sich unter Last
      # gegenseitig – mit 2 Verbindungen fällt das in den Parallel-Tests
      # sofort auf, unabhängig von der CPU-Zahl des Runners.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gartenai_test?schema=public&connection_limit=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      # Schlägt fehl, wenn schema.prisma geändert wurde, ohne eine Migration
      # dafür anzulegen (npx prisma migrate dev --name ...).
      - name: Schema und Migrationen stimmen überein
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run test:integration
        env:
          XRECHNUNG_OUT: ${{ runner.temp }}/xrechnung
      # Die in den Tests erzeugten E-Rechnungen gegen XML-Schema, EN 16931
      # und XRechnung-Regeln prüfen (scripts/validate-xrechnung.sh).
      - name: E-Rechnungen validieren
        env:
          XRECHNUNG_OUT: ${{ runner.temp }}/xrechnung
          XRECHNUNG_RULES_DIR: ${{ runner.temp }}/xrechnung-rules
        run: |
          command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils > /dev/null)
          npx jest test/xrechnung.spec.ts
          scripts/validate-xrechnung.sh "$XRECHNUNG_OUT"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true

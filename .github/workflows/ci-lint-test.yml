name: CI - Lint & Unit Tests

# Lint, Formatierung und Unit-Tests (Backend, Frontend) sowie die
# Integrationstests gegen PostgreSQL. E2E-Tests (ci-e2e.yml) und der
# Container-Rauchtest (ci-docker.yml) laufen in eigenen Workflows.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Blockierend für Lücken ab "high" in den Produktionsabhängigkeiten
      # (Stand: 0 Funde). Entwicklungswerkzeuge nur zur Information.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true
      # Alarmregeln für Prometheus (ops/prometheus): Syntax und Regeltests
      - name: Alarmregeln prüfen
        working-directory: ops/prometheus
        run: |
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts.test.yml

  # Integrationstests gegen eine echte PostgreSQL: dieselben Migrationen wie
  # in Produktion, echter Prisma-Client, echte HTTP-Aufrufe. Fängt Fehler, die
  # die Unit-Tests mit gemocktem Prisma-Client nicht sehen können.
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gartenai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Bewusst kleiner Verbindungspool: Abfragen, die innerhalb einer
      # Transaktion eine zweite Verbindung holen, blockieren sich unter Last
      # gegenseitig – mit 2 Verbindungen fällt das in den Parallel-Tests
      # sofort auf, unabhängig von der CPU-Zahl des Runners.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gartenai_test?schema=public&connection_limit=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      # Schlägt fehl, wenn schema.prisma geändert wurde, ohne eine Migration
      # dafür anzulegen (npx prisma migrate dev --name ...).
      - name: Schema und Migrationen stimmen überein
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      # S3-kompatibler Objektspeicher für die Dokument-Tests (moto, ein
      # S3-Nachbau in Python; MinIO verteilt keine freien Images mehr)
      - name: S3-Testserver starten
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install -q 'moto[server]==5.*'
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 9199 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:9199/ > /dev/null && break; sleep 1; done
      - run: npm run test:integration
        env:
          XRECHNUNG_OUT: ${{ runner.temp }}/xrechnung
          PDFA_OUT: ${{ runner.temp }}/pdfa
          S3_TEST_ENDPOINT: http://127.0.0.1:9199
      # Die in den Tests erzeugten E-Rechnungen gegen XML-Schema, EN 16931
      # und XRechnung-Regeln prüfen (scripts/validate-xrechnung.sh).
      - name: E-Rechnungen validieren
        env:
          XRECHNUNG_OUT: ${{ runner.temp }}/xrechnung
          XRECHNUNG_RULES_DIR: ${{ runner.temp }}/xrechnung-rules
        run: |
          command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils > /dev/null)
          npx jest test/xrechnung.spec.ts
          scripts/validate-xrechnung.sh "$XRECHNUNG_OUT"
      # Die in den Tests erzeugten PDFs: PDF/A-3b (veraPDF), Rechnungen
      # zusätzlich als ZUGFeRD mit eingebetteter XRechnung (Mustang).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/verapdf
          key: verapdf-${{ hashFiles('backend/scripts/validate-pdfa.sh') }}
      - name: PDF/A und ZUGFeRD validieren
        env:
          PDFA_OUT: ${{ runner.temp }}/pdfa
          VERAPDF_DIR: ${{ runner.temp }}/verapdf
        run: |
          npx jest test/zugferd.spec.ts
          scripts/validate-pdfa.sh "$PDFA_OUT"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true

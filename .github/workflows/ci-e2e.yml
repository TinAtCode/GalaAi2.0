name: CI - E2E Tests (Playwright)

# HINWEIS (siehe STATUS.md): Dieser Workflow konnte in der Entwicklungs-
# Sandbox nicht real ausgeführt werden, da sowohl `prisma generate` als
# auch der Playwright-Browser-Download dort netzwerkseitig blockiert sind.
# Auf echten GitHub-Actions-Runnern (normaler Internetzugang) funktionieren
# beide Schritte standardmäßig. Die Tests selbst wurden syntaktisch/typisch
# geprüft (`npx playwright test --list`, `tsc --noEmit`) und alle
# verwendeten data-testid-Selektoren gegen den tatsächlichen Code
# abgeglichen.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gartenai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend – Abhängigkeiten & DB vorbereiten
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gartenai?schema=public
          JWT_SECRET: ci-test-secret
        # Dieselben Migrationen wie in Produktion (prisma/migrations/).
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Backend starten
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gartenai?schema=public
          JWT_SECRET: ci-test-secret
          PORT: 3000
          # Die E2E-Suite meldet sich in fast jedem Test neu an – mit dem
          # Produktionslimit (5/Minute) scheitern die Tests sonst an 429.
          LOGIN_RATE_LIMIT: 1000
          LOGIN_IP_RATE_LIMIT: 1000
          # Alle E2E-Tests laufen als derselbe Nutzer (Anfrage-Limit je Nutzer)
          RATE_LIMIT: 5000
          # Mails nur im Speicher (Rechnungsversand im E2E-Test)
          SMTP_URL: test
          MAIL_FROM: Musterbetrieb <rechnung@musterbetrieb.de>
        run: |
          npm run build
          node dist/main.js &
          npx wait-on http://localhost:3000/health --timeout 30000

      - name: Frontend – Abhängigkeiten & Playwright-Browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Frontend starten
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:3000
        run: |
          npm run dev -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 30000

      - name: E2E-Tests ausführen
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

# Betrieb auf einem eigenen Server: PostgreSQL, Backend, Frontend (nginx).
# Start:   cp .env.production.example .env.production  (Werte eintragen)
#          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Erste Firma und Administrator: siehe README, Abschnitt "Betrieb".
# Automatisch ausrollen (fertige Images aus der Registry): ops/deploy.sh, siehe BETRIEB.md.
# Von außen erreichbar ist nur das Frontend (Port APP_PORT, Standard 8080);
# davor gehört ein Reverse-Proxy mit HTTPS (z.B. Caddy oder ein vorhandener nginx).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gartenai
      POSTGRES_USER: gartenai
      # steht auch in DATABASE_URL: nur Buchstaben und Ziffern (openssl rand -hex 32)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gartenai -d gartenai']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    # GARTENAI_IMAGE/GARTENAI_VERSION: fertige Images (ops/deploy.sh); ohne = lokal bauen
    image: ${GARTENAI_IMAGE:-gartenai}-backend:${GARTENAI_VERSION:-local}
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gartenai:${POSTGRES_PASSWORD}@postgres:5432/gartenai?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt}
      # verschlüsselt gespeicherte Geheimnisse (API-Schlüssel der KI-Anbieter)
      SECRET_KEY: ${SECRET_KEY:-}
      AI_BLOCK_PRIVATE_NETWORKS: ${AI_BLOCK_PRIVATE_NETWORKS:-}
      # Kontakt für die Push-Dienste (Google, Mozilla, Apple), z.B. mailto:it@firma.de
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      # laufende Version (GET /api/health), prüft ops/deploy.sh nach dem Start
      GARTENAI_VERSION: ${GARTENAI_VERSION:-local}
      # Anzahl Proxys vor dem Backend: 1 = nur nginx, 2 = HTTPS-Proxy + nginx
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Anmelden mit Google oder einem anderen OIDC-Anbieter (BUERO.md / BETRIEB.md)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_HISTORY: ${METRICS_HISTORY:-}
      METRICS_HISTORY_DAYS: ${METRICS_HISTORY_DAYS:-}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      # Dokumente im Objektspeicher (STORAGE=s3), sonst im Volume uploads
      STORAGE: ${STORAGE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_SSE: ${S3_SSE:-}
    # selbst gehostete KI auf dem Server selbst (z.B. Ollama): http://host.docker.internal:11434/v1
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - uploads:/data/uploads

  frontend:
    image: ${GARTENAI_IMAGE:-gartenai}-frontend:${GARTENAI_VERSION:-local}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${APP_PORT:-8080}:8080'

volumes:
  pg_data:
  uploads:

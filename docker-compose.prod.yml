# Betrieb auf einem eigenen Server: PostgreSQL, Backend, Frontend (nginx).
# Start:   cp .env.production.example .env.production  (Werte eintragen)
#          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Erste Firma und Administrator: siehe README, Abschnitt "Betrieb".
# Von außen erreichbar ist nur das Frontend (Port APP_PORT, Standard 8080);
# davor gehört ein Reverse-Proxy mit HTTPS (z.B. Caddy oder ein vorhandener nginx).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gartenai
      POSTGRES_USER: gartenai
      # steht auch in DATABASE_URL: nur Buchstaben und Ziffern (openssl rand -hex 32)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gartenai -d gartenai']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gartenai:${POSTGRES_PASSWORD}@postgres:5432/gartenai?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt}
      # Anzahl Proxys vor dem Backend: 1 = nur nginx, 2 = HTTPS-Proxy + nginx
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_HISTORY: ${METRICS_HISTORY:-}
      METRICS_HISTORY_DAYS: ${METRICS_HISTORY_DAYS:-}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${APP_PORT:-8080}:8080'

volumes:
  pg_data:
  uploads:

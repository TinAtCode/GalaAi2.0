# Steht ein HTTPS-Proxy davor, dessen Protokollangabe weitergeben
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Uploads: Dokumente bis 20 MB, OCR bis 15 MB (siehe Backend)
  client_max_body_size 25m;

  # Docker-DNS: die Adresse des Backends bei jeder Anfrage neu auflösen –
  # sonst 502 nach einem Neustart des Backends (neue IP), und nginx startet
  # nicht, solange das Backend fehlt
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend http://backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Dateien mit Hash im Namen dürfen lange im Cache bleiben
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-Page-App: unbekannte Pfade liefern index.html (ohne Cache)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    try_files $uri /index.html;
  }
}
